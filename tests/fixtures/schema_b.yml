dialect: postgresql
tables:
  users:
    columns:
      - name: id
        type: uuid
        primary_key: true
        nullable: false
      - name: email
        type: varchar(255)
        nullable: false
      - name: name
        type: varchar(100)
        nullable: true
      - name: created_at
        type: timestamptz
        nullable: true
      - name: phone
        type: varchar(20)
        nullable: true
    indexes:
      - name: idx_users_email
        columns: [email]
        unique: true
    unique_constraints:
      - name: uq_users_email
        columns: [email]
  orders:
    columns:
      - name: id
        type: serial
        primary_key: true
        nullable: false
      - name: user_id
        type: uuid
        nullable: false
      - name: total_cents
        type: bigint
        nullable: true
  products:
    columns:
      - name: id
        type: serial
        primary_key: true
        nullable: false
      - name: name
        type: varchar(255)
        nullable: false
      - name: price_cents
        type: bigint
        nullable: false
