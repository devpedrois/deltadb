[project]
name = "deltadb"
version = "0.1.0"
requires-python = ">=3.11"
description = "Schema Diff & Migration Generator"
dependencies = [
    "sqlalchemy>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
]

[project.scripts]
deltadb = "deltadb.cli:deltadb"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration (requires Docker)",
    "docker_security: marks tests that verify running Docker container hardening",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deltadb*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
